[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "taikonation"
version = "2.0.0"
description = "Audio-to-Taiko chart generation studio and research toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "huggingface-hub>=1.2,<2",
  "librosa>=0.10.2,<1",
  "numba>=0.60",
  "numpy>=1.26,<2.1",
  "python-multipart>=0.0.9",
  "python-socketio>=5.11,<6",
  "PyYAML>=6,<7",
  "safetensors>=0.4",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "soundfile>=0.12",
  "torch>=2.3,<3",
  "tqdm>=4.66,<5",
  "uvicorn[standard]>=0.30,<1",
  "wandb>=0.17,<1",
]

[project.scripts]
taikonation-train = "taikonation.cli:train"
taikonation-generate = "taikonation.cli:generate"
taikonation-generate-research = "taikonation.cli:generate_research"
taikonation-import-reference = "taikonation.cli:import_reference"
taikonation-serve = "taikonation.cli:serve"

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["taikonation*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
