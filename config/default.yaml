# config/default.yaml

# This file contains the default hyperparameters for the TaikoTransformer model,
# data processing, and training pipeline.

model:
  d_model: 256
  nhead: 8
  num_encoder_layers: 6
  num_decoder_layers: 6
  dim_feedforward: 1024
  dropout: 0.1
  audio_feature_size: 80 # Corresponds to the 80 bands in the spectrogram
  use_gradient_checkpointing: true
  # Vocab size, num_genres, and num_difficulties are determined at runtime from the dataset

data:
  max_sequence_length: 512
  # Preserve much more of the original ~23ms rhythmic/onset signal while
  # keeping 512-token attention practical on an 8GB GPU.
  time_quantization_ms: 46.4
  source_resolution_ms: 23.2
  # Training overlaps windows so motifs across boundaries are not discarded;
  # validation stays non-overlapping for a less redundant metric.
  window_stride: 256
  validation_window_stride: 512

training:
  batch_size: 4
  effective_batch_size: 32
  learning_rate: 0.0001
  num_epochs: 100
  k_folds: 5
  use_wandb: true

  weight_decay: 0.01
  warmup_ratio: 0.1
  scheduler_type: 'cosine_warmup'
  restart_period: 10

  early_stopping_patience: 10
  early_stopping_delta: 0.0001

  num_workers: 4
  prefetch_factor: 2

  save_path: './output/taiko_transformer.pth'
  keep_best_n: 3
  keep_last_n: 2
  save_every_n_epochs: 5
  cleanup_checkpoints: false

generate:
  # Parameters for chart generation
  max_output_length: 1024
  # Default difficulty to use if not specified via CLI
  default_difficulty: "oni"
  # Beam size for beam search decoding (1 = greedy)
  beam_size: 1
